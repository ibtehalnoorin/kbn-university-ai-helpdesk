name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kbn
          POSTGRES_PASSWORD: kbn
          POSTGRES_DB: kbn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kbn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .:backend
      TEST_DATABASE_URL: postgresql://kbn:kbn@localhost:5432/kbn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt
      - run: pip install -r backend/requirements-prod.txt pytest "pytest-asyncio>=0.24,<1"
      - run: pytest backend/tests -q
        env:
          RUN_SLOW: "1"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
